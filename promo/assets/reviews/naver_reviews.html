단 조차 오르기를 두려워하는 할머님..\n\n0년 넘게 환자분들을 1:1로 마주하면서 치료해드리다 보니, 저는 그분들의 삶의 일부에 녹아들어가있습니다.\n\n그러다보니 치료받은 환자가 좋아져서 기쁜일이 생기면 저도 같이 기뻐하고, 슬픈일이 생기면 함께 속상해지곤 합니다..ㅎㅎ\n\n한 사람의 짧은 10~30분의 상담\u002F치료 시간이 저에게는 그 무엇보다 소중한 시간이고, 매일 새롭게 마주하는 환자분들을 생각하면 하루하루 설렙니다.\n\n만약 저를 믿고 찾아주신다면 짧은 만남일지 모르더라도, 그 시간 만큼은 세상에서 누구보다 귀 기울이고 치료해드리겠습니다.\n\n아래는 1인 정형외과에서 보기 드문, 저의 진료 범위 입니다. 10년 차 전문의 경력으로, 여러분들의 통증을 해결하는데 최대한 노력하겠습니다.\n\n\u003C진료센터\u003E\n1.통증치료 :프롤로주사치료, DNA주사치료, 초음파주사치료, C-arm주사치료, 체외충격파치료(스톨즈충격파)\n\n2.척추클리닉 :목통증, 목디스크, 허리통증, 허리디스크 척추관협착증, 일자목\u002F거북목\n\n3.소아정형클리닉 : 척추측만증 검사, 성장판 검사, 소아 외상진료, 탈골치료, 통기브스처치 가능\n\n4.관절클리닉 : 무릎통증, 발목통증 , 발통증, 어깨통증,회전근개손상, 팔꿈치\u002F팔통증, 손\u002F발목통증 및 저림\n\n5.골절\u002F족부클리닉 : 발목골절, 발가락골절, 관절탈구, 아킬레스건염, 족저근막염, 발정맥질환\n\n6. 수술 후 재활치료 : 회전근개 수술, 어깨골절 수술, 무릎, 고관절 인공관절, 십자인대 재건술, 발목인대 재건술 이후에 관절 회복을 위한 재활치료\n\n7.교통사고 후유증 :교통사고 검서 및 급성기 치료, 주사치료(교통사고 치료는 본인부담금 0원)\n\n\u003C혈관\u002F하지정맥센터\u003E\n- 다리저림, 하지무거움\n- 하지저림감 정맥역류에 의한 하지정맥치료 및 수술(시술가능)\n\n\u003C수술센터\u003E\n-방아쇠수지증후군 수술\n-손목터널증후군 수술\n-지방종 수술\n-결절종 수술\n-피지낭종 수술\n\n정형외과진료, 목통증, 허리통증, 어깨통증, 무릎통증, 정형외과진료\n2호선낙성대역4번출구 직진100m","silson24":true,"vehicleInsurance":true,"staticMapUrl":"https:\u002F\u002Fsimg.pstatic.net\u002Fstatic.map\u002Fv2\u002Fmap\u002Fstaticmap.bin?center=126.9616756%2C37.477522&level=16&dataversion=178.43&caller=naver_mstore&markers=pos%3A126.9616756%2037.477522%7Ccolor%3Ablue","isNFASafetyCertified":false,"isAntiqueStore":false,"visitorReviewMediasTotal":53,"isKoreaGrandSale":false,"hasAroundItems":true,"acceptsCultureDeductionCoupon":false,"phoneInfo":{"__typename":"PlacePhoneInfo","phone":"02-872-3301","isVirtualPhone":false,"isPrivatePhone":false,"hasMobilePhoneNumber":false},"panoramaThumbnail":{"__typename":"PanoramaThumbnailResult","url":"https:\u002F\u002Fapis.naver.com\u002Fplace\u002Fpanorama\u002Fthumbnail\u002F13154835\u002F0?width=800&height=400&msgpad=1790401225429&md=G1aYDzGpZIqVt5G5OXIkkhbdlZU%3D"},"images":{"__typename":"PlaceDetailImages","images":[{"__typename":"Image","origi
