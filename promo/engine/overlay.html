<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1920px; height: 1080px; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Pretendard", "Noto Sans CJK KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pos { position: absolute; left: 0; right: 0; display: flex; box-sizing: border-box; }
  .anim { transform-origin: 50% 50%; }
  .text { white-space: pre-line; word-break: keep-all; overflow-wrap: break-word; }
  .card {
    box-sizing: border-box; padding: 44px 52px; border-radius: 28px; color: #fff;
    background: rgba(14, 14, 16, 0.74); border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  }
  .stars { display: flex; gap: 6px; }
  .stars svg { width: 36px; height: 36px; }
  .review {
    margin-top: 22px; font-size: 44px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em;
    word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .source { margin-top: 26px; font-size: 28px; font-weight: 500; opacity: 0.6; letter-spacing: 0; }
  .flash { position: absolute; inset: 0; }
  .rt { box-sizing: border-box; padding: 40px 52px 34px; border-radius: 26px; color: #fff;
        background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.13); }
  .rt .head { display: flex; align-items: center; gap: 18px; }
  .rt .avatar { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2b6fd6, #6ea8ff); flex: none; }
  .rt .nick { font-size: 33px; font-weight: 600; letter-spacing: -0.01em; }
  .rt .chip { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.62); margin-top: 2px; }
  .rt .date { margin-left: auto; font-size: 24px; color: rgba(255,255,255,0.5); }
  .rt .body { margin-top: 32px; min-height: 190px; font-size: 64px; font-weight: 500; line-height: 1.45; letter-spacing: -0.01em;
        word-break: keep-all; white-space: pre-wrap; }
  .rt .caret { display: inline-block; width: 4px; height: 0.95em; background: #fff; vertical-align: -0.12em; margin-left: 4px; border-radius: 2px; }
  .rt .caret.off { visibility: hidden; }
  .rt .foot { display: flex; justify-content: flex-end; margin-top: 22px; }
  .rt .btn { font-size: 27px; font-weight: 600; padding: 12px 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
        color: rgba(255,255,255,0.7); transform-origin: 50% 50%; }
  .rt .btn.on { background: #2f7fe0; border-color: #2f7fe0; color: #fff; }
  .chat { position: relative; }
  .msg { position: absolute; left: 0; display: flex; align-items: flex-end; gap: 18px; transform-origin: 0% 100%; }
  .msg .av { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
             font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2b6fd6, #6ea8ff); margin-bottom: 4px; }
  .msg .col { display: flex; flex-direction: column; gap: 10px; }
  .msg .meta { font-size: 26px; color: rgba(255,255,255,0.62); padding-left: 6px; }
  .msg .bubble { display: inline-block; background: #f4f4f6; color: #111114; border-radius: 30px; border-bottom-left-radius: 8px; padding: 26px 36px;
                 font-size: 58px; font-weight: 500; line-height: 1.4; letter-spacing: -0.012em; word-break: keep-all; white-space: pre-wrap;
                 box-shadow: 0 18px 50px rgba(0,0,0,0.35); max-width: 1180px; }
  .msg .dots { display: inline-flex; gap: 12px; align-items: center; background: #f4f4f6; border-radius: 30px; border-bottom-left-radius: 8px; padding: 30px 34px; }
  .msg .dots i { width: 16px; height: 16px; border-radius: 50%; background: #8a8a92; display: block; }
  .rcpt { position: relative; }
  .rcpt .printer { position: absolute; left: 50%; transform: translateX(-50%); top: 0; width: 1260px; height: 88px; border-radius: 20px;
                   background: linear-gradient(180deg, #2a2a2f, #151518); box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
  .rcpt .printer::after { content: ""; position: absolute; left: 110px; right: 110px; bottom: 14px; height: 7px; border-radius: 3px; background: #050506; }
  .rcpt .win { position: absolute; left: 50%; transform: translateX(-50%); top: 74px; width: 1000px; overflow: hidden; }
  .rcpt .paper { position: relative; width: 1000px; background: #faf8f2; color: #17171a; padding: 44px 56px 34px;
                 font-family: "NanumGothicCoding", "Pretendard", monospace; font-size: 34px; line-height: 1.5; letter-spacing: 0;
                 box-shadow: 0 30px 60px rgba(0,0,0,0.45); transform-origin: 50% 0%;
                 clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), 97.5% 100%, 95% calc(100% - 14px), 92.5% 100%, 90% calc(100% - 14px), 87.5% 100%, 85% calc(100% - 14px), 82.5% 100%, 80% calc(100% - 14px), 77.5% 100%, 75% calc(100% - 14px), 72.5% 100%, 70% calc(100% - 14px), 67.5% 100%, 65% calc(100% - 14px), 62.5% 100%, 60% calc(100% - 14px), 57.5% 100%, 55% calc(100% - 14px), 52.5% 100%, 50% calc(100% - 14px), 47.5% 100%, 45% calc(100% - 14px), 42.5% 100%, 40% calc(100% - 14px), 37.5% 100%, 35% calc(100% - 14px), 32.5% 100%, 30% calc(100% - 14px), 27.5% 100%, 25% calc(100% - 14px), 22.5% 100%, 20% calc(100% - 14px), 17.5% 100%, 15% calc(100% - 14px), 12.5% 100%, 10% calc(100% - 14px), 7.5% 100%, 5% calc(100% - 14px), 2.5% 100%, 0 calc(100% - 14px)); }
  .rcpt .c { text-align: center; }
  .rcpt .t1 { font-size: 42px; font-weight: 700; }
  .rcpt .t2 { font-size: 31px; color: #4a4a50; margin-top: 2px; }
  .rcpt .hr { border-top: 3px dashed #b9b6ad; margin: 22px 0; }
  .rcpt .kv { display: flex; justify-content: space-between; font-size: 32px; color: #2a2a2f; }
  .rcpt .body { font-size: 58px; font-weight: 700; line-height: 1.4; word-break: keep-all; white-space: pre-wrap; margin: 8px 0 6px; }
  .rcpt .bar { height: 64px; margin: 8px auto 10px; width: 720px;
               background: repeating-linear-gradient(90deg, #1a1a1c 0 4px, transparent 4px 7px, #1a1a1c 7px 9px, transparent 9px 15px, #1a1a1c 15px 21px, transparent 21px 24px, #1a1a1c 24px 26px, transparent 26px 33px); }
  .rcpt .foot { font-size: 28px; color: #4a4a50; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const SAFE = 96;
  const TEXT_DEFAULTS = {
    size: 200, weight: 900, color: "#fff", x: "center", y: "center", letter_spacing: -0.04,
    line_height: 1.05, anim_in: "hit", anim_out: "cut", max_width: 1500, align: "center", shadow: true,
  };
  const CARD_DEFAULTS = { stars: 5, source: "", anim_in: "rise", anim_out: "cut", x: "center", y: "center", width: 1100 };
  const FLASH_DEFAULTS = { frames: 2, color: "#fff", opacity: 0.9 };
  const IMAGE_DEFAULTS = { width: 900, x: "center", y: "center", anim_in: "fade", anim_out: "cut", opacity: 1 };
  const pendingImages = [];
  const STAR = "M12 2.6l2.9 6.2 6.8.8-5 4.6 1.3 6.7-6-3.3-6 3.3 1.3-6.7-5-4.6 6.8-.8z";

  let fps = 30, items = [];
  const toFrame = (sec) => Math.floor(sec * fps + 0.5);
  const r4 = (v) => Math.round(v * 10000) / 10000;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeInOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const easeOutBack = (p, c) => 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
  const ramp = (lf, n) => clamp01(lf / n);          // geometry: start value shown on frame 0
  const fadeIn = (lf, n) => clamp01((lf + 1) / n);  // opacity: 1/n on frame 0, 1 on frame n-1

  // Placement wrapper: x via flex, y via top/bottom (+translateY for center).
  function place(spec, el) {
    const pos = document.createElement("div");
    pos.className = "pos";
    const x = spec.x, y = spec.y;
    if (typeof x === "number") { pos.style.justifyContent = "flex-start"; pos.style.paddingLeft = x + "px"; }
    else { pos.style.justifyContent = { left: "flex-start", right: "flex-end" }[x] || "center";
           pos.style.paddingLeft = pos.style.paddingRight = SAFE + "px"; }
    if (typeof y === "number") pos.style.top = y + "px";
    else if (y === "top") pos.style.top = SAFE + "px";
    else if (y === "bottom") pos.style.bottom = SAFE + "px";
    else { pos.style.top = "50%"; pos.style.transform = "translateY(-50%)"; }
    pos.appendChild(el);
    return pos;
  }

  const EASES = {
    expo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    cubic: (p) => 1 - Math.pow(1 - p, 3),
    back: (p) => easeOutBack(p, 1.35),
    inOut: (p) => easeInOut(p),
    linear: (p) => p,
  };
  const easeFn = (name, dflt) => EASES[name] || EASES[dflt || "expo"];

  // reveal / exit 용 단위 분해: 줄 > 단어 > 음절. 각 단계에 마스크(겉)와 움직이는 속(안)을 둔다
  function buildUnits(el, s) {
    const R = s.reveal || {}, X = s.exit || {};
    const unit = R.unit || X.unit || "word";
    const needMask = R.style === "rise" || X.style === "rise";
    const mask = (e) => { e.style.overflow = "hidden"; e.style.paddingTop = "0.12em"; e.style.paddingBottom = "0.18em"; e.style.marginTop = "-0.12em"; e.style.marginBottom = "-0.18em"; };
    const units = [], words = [], chars = [];
    // "*둘 다*"처럼 여러 단어에 걸친 강조를 단어마다 나눈다
    const txt = s.text.replace(/\*([^*]+)\*/g, (m, g) => g.split(/( +)/).map(w => (/^ +$/.test(w) || !w ? w : `*${w}*`)).join(""));
    const lines = txt.split("\n");
    lines.forEach((line, li) => {
      const lineMask = document.createElement("div"), lineInner = document.createElement("div");
      lineMask.appendChild(lineInner); el.appendChild(lineMask);
      let lineUnit = null;
      if (unit === "line") { if (needMask) mask(lineMask); lineUnit = { el: lineInner, line: li, j: 0, chars: [] }; units.push(lineUnit); }
      const parts = line.split(/( +)/).filter(Boolean);
      const wordParts = parts.filter(x => !/^ +$/.test(x));
      let wi = 0, jInLine = 0;
      parts.forEach(part => {
        if (/^ +$/.test(part)) { lineInner.appendChild(document.createTextNode(part)); return; }
        const am = /^\*([^*]+)\*([,.!?…]*)$/.exec(part);
        const core = am ? am[1] : part.replace(/\*/g, ""), tail = am ? am[2] : "";
        const wMask = document.createElement("span"), wInner = document.createElement("span");
        wMask.style.display = "inline-block"; wMask.style.whiteSpace = "nowrap"; wInner.style.display = "inline-block";
        wMask.appendChild(wInner); lineInner.appendChild(wMask);
        let wordUnit = null;
        if (unit === "word") { if (needMask) mask(wMask); wordUnit = { el: wInner, line: li, j: jInLine++, chars: [] }; units.push(wordUnit); }
        words.push({ el: wMask, accent: !!am, line: li });
        const cs = [...Array.from(core).map(c => ({ c, acc: !!am })), ...Array.from(tail).map(c => ({ c, acc: false }))];
        cs.forEach((ch, ci) => {
          const cMask = document.createElement("span"), cInner = document.createElement("span");
          cMask.style.display = "inline-block"; cInner.style.display = "inline-block"; cInner.textContent = ch.c;
          const full = ch.acc ? (s.accent_color || "#003070") : s.color;
          if (ch.acc) cInner.style.color = full;
          cMask.appendChild(cInner); wInner.appendChild(cMask);
          if (s.hang_quotes) {
            if (ch.c === "“" && wi === 0 && ci === 0) cMask.style.marginLeft = (-measure("“", Object.assign({}, s, { font: s.font || "Pretendard" }))) + "px";
            if (ch.c === "”" && wi === wordParts.length - 1 && ci === cs.length - 1) cMask.style.marginRight = (-measure("”", Object.assign({}, s, { font: s.font || "Pretendard" }))) + "px";
          }
          const cref = { el: cInner, full };
          chars.push(cref);
          if (unit === "char") { if (needMask) mask(cMask); units.push({ el: cInner, line: li, j: jInLine++, chars: [cref] }); }
          if (wordUnit) wordUnit.chars.push(cref);
          if (lineUnit) lineUnit.chars.push(cref);
        });
        wi++;
      });
    });
    return { units, words, chars };
  }

  function makeText(t) {
    const s = Object.assign({}, TEXT_DEFAULTS, t);
    const el = document.createElement("div");
    el.className = "anim text";
    // words: 단어별 등장 시각(초) 배열. *단어*는 강조색(accent_color). 둘 중 하나라도 있으면 단어를 span으로 나눈다.
    const wordsF = Array.isArray(s.words) && s.words.length ? s.words.map(t => toFrame(t)) : null;
    const spans = [];
    let U = null;
    if (s.reveal || s.exit) {
      U = buildUnits(el, s);
    } else if (wordsF || /\*[^*]+\*/.test(s.text)) {
      s.text.split("\n").forEach((line, li) => {
        if (li > 0) el.appendChild(document.createElement("br"));
        line.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(part)); return; }
          const sp = document.createElement("span");
          sp.style.display = "inline-block";
          let txt = part;
          const am = /^\*([^*]+)\*([,.!?…]*)$/.exec(part);
          // 따옴표 내밀기: 여는 “와 닫는 ”를 따로 감싸 음수 여백을 주면 글자 덩어리가 가운데에 선다
          let openQ = "", closeQ = "";
          if (s.hang_quotes && !am) {
            if (txt.startsWith("“")) { openQ = "“"; txt = txt.slice(1); }
            if (txt.endsWith("”")) { closeQ = "”"; txt = txt.slice(0, -1); }
          }
          if (openQ) { const q = document.createElement("span"); q.textContent = openQ; q.style.marginLeft = (-measure(openQ, Object.assign({ font: "Pretendard" }, s))) + "px"; sp.appendChild(q); }
          if (am) {
            const inner = document.createElement("span"); inner.textContent = am[1]; inner.style.color = s.accent_color || "#003070"; sp.appendChild(inner);
            if (am[2]) sp.appendChild(document.createTextNode(am[2]));
          } else sp.appendChild(document.createTextNode(txt));
          if (closeQ) { const q = document.createElement("span"); q.textContent = closeQ; q.style.marginRight = (-measure(closeQ, Object.assign({ font: "Pretendard" }, s))) + "px"; sp.appendChild(q); }
          el.appendChild(sp);
          spans.push(sp);
        });
      });
    } else el.textContent = s.text;
    if (s.hang_quotes) el.style.whiteSpace = "pre";
    if (s.font) el.style.fontFamily = `"${s.font}", "Pretendard", "Noto Sans CJK KR", sans-serif`;
    Object.assign(el.style, {
      fontSize: s.size + "px", fontWeight: String(s.weight), color: s.color,
      letterSpacing: s.letter_spacing + "em", lineHeight: String(s.line_height),
      maxWidth: s.max_width + "px", textAlign: s.align,
      textShadow: s.shadow ? "0 2px 24px rgba(0,0,0,.55)" : "none",
    });
    // Chromium applies letter-spacing after the last glyph too, so a centered line's advance box
    // sits |ls|/2 off center. Pad the right side by |ls| to center the advance box exactly.
    if (s.align === "center" && s.letter_spacing < 0) el.style.paddingRight = (-s.letter_spacing) + "em";
    const it = { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), spans: wordsF ? spans : null, wordsF };
    if (U) {
      // 단위별 등장·퇴장 시각(프레임)
      const R = s.reveal || null, X = s.exit || null;
      const n = U.units.length;
      U.units.forEach((u, i) => {
        if (R) {
          const base = Array.isArray(R.line_times) && R.line_times.length ? R.line_times[Math.min(u.line, R.line_times.length - 1)] + u.j * (R.stagger || 0)
                                                                         : s.start + (R.delay || 0) + i * (R.stagger || 0);
          if (Array.isArray(R.unit_times) && R.unit_times[i] !== undefined) u.tf = toFrame(R.unit_times[i]); else u.tf = toFrame(base);
        }
        if (X && X.style !== "zoom") u.xf = it.ef - (X.dur || 8) - Math.round((n - 1 - i) * (X.stagger || 0) * fps);
      });
      it.units = U.units; it.uwords = U.words; it.uchars = U.chars;
    }
    if (s.sheen || s.underline) {
      const holder = document.createElement("div");
      holder.style.position = "relative"; holder.style.display = "inline-block";
      holder.appendChild(el);
      if (s.sheen) {
        const clone = el.cloneNode(true);
        const sc = s.sheen.color || "#ffffff";
        clone.style.color = sc; clone.querySelectorAll("span").forEach(x => { x.style.color = sc; });
        Object.assign(clone.style, { position: "absolute", left: "0", top: "0", width: "100%", pointerEvents: "none", opacity: "0" });
        holder.appendChild(clone);
        it.clone = clone;
      }
      if (s.underline) {
        const bar = document.createElement("div");
        Object.assign(bar.style, { position: "absolute", height: (s.underline.thickness || 8) + "px", background: s.underline.color || s.accent_color || "#003070",
                                   transformOrigin: "0 50%", transform: "scaleX(0)", borderRadius: ((s.underline.thickness || 8) / 2) + "px" });
        holder.appendChild(bar);
        it.bar = bar;
      }
      it.root = holder;
    }
    return it;
  }

  function makeCard(c) {
    const s = Object.assign({}, CARD_DEFAULTS, c);
    const el = document.createElement("div");
    el.className = "anim card";
    el.style.width = s.width + "px";
    const stars = document.createElement("div");
    stars.className = "stars";
    for (let i = 0; i < 5; i++) {
      const fill = i < s.stars ? "#FFC53D" : "rgba(255,255,255,0.22)";
      stars.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 24 24"><path d="${STAR}" fill="${fill}"/></svg>`);
    }
    const review = document.createElement("div");
    review.className = "review";
    review.textContent = s.text;
    el.appendChild(stars);
    el.appendChild(review);
    if (s.source) {
      const src = document.createElement("div");
      src.className = "source";
      src.textContent = s.source;
      el.appendChild(src);
    }
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end) };
  }

  function makeImage(im) {
    const s = Object.assign({}, IMAGE_DEFAULTS, im);
    const el = document.createElement("img");
    el.className = "anim image";
    el.src = s.src.startsWith("data:") || s.src.startsWith("file://") ? s.src : "file://" + encodeURI(s.src);
    el.style.width = s.width + "px";
    el.style.height = "auto";
    el.style.display = "block";
    pendingImages.push(el.decode().catch(() => {}));
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), maxOpacity: s.opacity };
  }

  // ---------------------------------------------------------------- fx: slot / ticker / grid / count
  const FX_DEFAULTS = { size: 150, weight: 700, color: "#1d1d1f", letter_spacing: -0.035, line_height: 1.14, x: "center", y: "center",
                        align: "center", anim_in: "none", anim_out: "cut", font: "Pretendard" };
  const _canvas = document.createElement("canvas").getContext("2d");
  function measure(text, s) { _canvas.font = `${s.weight} ${s.size}px "${s.font}", "Pretendard", sans-serif`; return Math.max(1, _canvas.measureText(text).width + s.size * s.letter_spacing * text.length); }
  function styleText(el, s) {
    Object.assign(el.style, { fontFamily: `"${s.font}", "Pretendard", "Noto Sans CJK KR", sans-serif`, fontSize: s.size + "px", fontWeight: String(s.weight),
      color: s.color, letterSpacing: s.letter_spacing + "em", lineHeight: String(s.line_height), whiteSpace: "nowrap" });
  }
  function makeFx(sp) {
    const s = Object.assign({}, FX_DEFAULTS, sp);
    if (s.type === "shape_wipe" || s.type === "line_draw") { s.x = 0; s.y = 0; }
    const el = document.createElement("div");
    el.className = "anim fx";
    styleText(el, s);
    const it = { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end) };
    if (s.type === "slot") {
      // "{허리|무릎|어깨} 아프면," : 빈자리 단어가 위로 굴러 바뀐다
      const m = /^([\s\S]*?)\{([^}]+)\}([\s\S]*)$/.exec(s.text);
      const pre = m ? m[1] : "", words = m ? m[2].split("|") : [s.text], post = m ? m[3] : "";
      const widths = words.map(x => Math.ceil(measure(x, s)));   // 단어마다 폭이 달라 슬롯 폭을 함께 움직인다 (문장이 다시 가운데로 맞춰진다)
      const w = Math.max(...widths);
      const h = Math.ceil(s.size * s.line_height);
      const slot = document.createElement("span");
      Object.assign(slot.style, { display: "inline-block", position: "relative", width: w + "px", height: h + "px", overflow: "hidden", verticalAlign: "bottom", textAlign: "left" });
      const spans = words.map(wd => { const x = document.createElement("span"); x.textContent = wd; x.style.color = s.slot_color || s.color;
        Object.assign(x.style, { position: "absolute", left: 0, top: 0, height: h + "px", lineHeight: h + "px", willChange: "transform" }); slot.appendChild(x); return x; });
      el.appendChild(document.createTextNode(pre)); el.appendChild(slot); el.appendChild(document.createTextNode(post));
      let vblur = null;
      if (s.roll_blur) {
        const fid = "vb" + Math.random().toString(36).slice(2, 8);

  // spec.in_frames / spec.out_frames override the default frame counts; spec.hit_scale overrides the start scale of hit/slam.
  function animIn(kind, lf, spec) {
    const n = spec && spec.in_frames;
    const hs = spec && spec.hit_scale;
    switch (kind) {
      case "hit": {
        // hit_blur(배율 1당 px)를 주면 시작 흐림이 배율에 비례한다. 없으면 예전 영상과 같은 1px
        const e = easeOut(ramp(lf, n || 4)); const s0 = hs || 1.10; const hb = spec && spec.hit_blur;
        return { scale: s0 - (s0 - 1) * e, dy: 0, opacity: 1, blur: hb ? (s0 - 1) * hb * (1 - e) : 1 - e };
      }
      case "focus": {
        // 초점이 맞듯 흐림 12px·1.04배에서 선명해진다 (로고·서명)
        const N = n || 16, e = EASES.expo(ramp(lf, N));
        return { scale: 1.04 - 0.04 * e, dy: 0, opacity: fadeIn(lf, Math.ceil(N * 0.5)), blur: 12 * (1 - e) };
      }
      case "slam": { const e = easeOut(ramp(lf, n || 3)); const s0 = hs || 1.7; return { scale: s0 - (s0 - 1) * e, dy: 0, opacity: fadeIn(lf, 2), blur: 0 }; }
      case "fade": { const p = ramp(lf, n || 8); return { scale: 1, dy: 12 * (1 - p), opacity: fadeIn(lf, n || 8), blur: 0 }; }
      case "rise": { const e = easeOut(ramp(lf, n || 6)); return { scale: 1, dy: 40 * (1 - e), opacity: fadeIn(lf, n || 6), blur: 0 }; }
      case "track": {
        // 자간이 넓고 흐린 상태에서 조여지며 선명해진다 (키노트 타이틀)
        const N = n || 16; const tf = (spec && typeof spec.track_from === "number") ? spec.track_from : 0;
        const e = easeOut(tf + (1 - tf) * ramp(lf, N));      // track_from: 0이면 완전히 흐린 상태, 0.5면 반쯤 선명한 상태에서 시작
        const base = (spec && typeof spec.letter_spacing === "number") ? spec.letter_spacing : -0.04;
        return { scale: 1.015 - 0.015 * e, dy: 0, opacity: tf > 0 ? Math.max(tf, fadeIn(lf, Math.ceil(N * 0.6))) : fadeIn(lf, Math.ceil(N * 0.6)), blur: 10 * (1 - e), ls: base + 0.14 * (1 - e) };
      }
      case "wipe": {
        // 빛이 왼쪽에서 오른쪽으로 지나가며 글자가 드러난다
        const N = n || 18; const p = ramp(lf, N);
        return { scale: 1, dy: 0, opacity: 1, blur: 0, wipe: p };
      }
      default: return { scale: 1, dy: 0, opacity: 1, blur: 0 };
    }
  }
  function animOut(kind, rem, spec, f) {
    const n = (spec && spec.out_frames) || 5;
    const to = spec && typeof spec.out_to === "number" ? spec.out_to : 0;
    if (kind === "fade" && spec && typeof spec.out_at === "number" && f !== undefined) {
      // out_at: 요소 끝이 아니라 정한 시각부터 out_frames 동안 옅어지고 그 뒤 out_to 유지
      return to + (1 - to) * (1 - clamp01((f - toFrame(spec.out_at) + 1) / n));
    }
    return kind === "fade" ? to + (1 - to) * clamp01(rem / n) : 1;
  }

  window.setTimeline = function (tl) {
    fps = tl.fps;
    items = [];
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    stage.style.width = tl.width + "px";
    stage.style.height = tl.height + "px";
    document.body.style.width = tl.width + "px";
    document.body.style.height = tl.height + "px";
    const texts = [], cards = [], images = [], typings = [], flashes = [];
    pendingImages.length = 0;
    for (const shot of tl.shots) {
      for (const im of shot.images || []) images.push(makeImage(im));
      for (const t of shot.texts || []) texts.push(makeText(t));
      for (const c of shot.cards || []) cards.push(makeCard(c));
      for (const ty of shot.typing || []) typings.push(makeTyping(ty));
      for (const ch of shot.chat || []) typings.push(makeChat(ch));
      for (const rc of shot.receipts || []) typings.push(makeReceipt(rc));
      for (const f of shot.flashes || []) flashes.push(makeFlash(f));
      for (const x of shot.fx || []) typings.push(makeFx(x));
    }
    window.__imagesReady = Promise.all(pendingImages).then(() => true);
    for (const it of [...images, ...texts, ...cards, ...typings]) { it.wrap = place(it.spec, it.root || it.el); stage.appendChild(it.wrap); items.push(it); }
    for (const it of flashes) { it.wrap = it.el; stage.appendChild(it.el); items.push(it); }
    for (const it of items) it.wrap.style.display = "none";
    return items.length;
  };

  // Pure function of the frame index. Returns a key describing the visible state.
  window.render = function (f) {
    const key = [];
    items.forEach((it, i) => {
      const visible = f >= it.sf && f < it.ef;
      it.wrap.style.display = visible ? (it.flash ? "block" : "flex") : "none";
      if (!visible) return;
      if (it.flash) { key.push(i + ":flash"); return; }
      let tkey = "";
      if (it.chat) tkey = ":c" + layoutChat(it, f);
      if (it.receipt) tkey = renderReceipt(it, f);
      if (it.typing) {
        // 누른 키 개수 -> 표시 문자열. 마지막 키 뒤 10프레임까지는 커서 고정, 그 뒤 15프레임 주기로 깜빡임
        let n = 0; while (n < it.keysF.length && it.keysF[n] <= f) n++;
        it.txt.textContent = n ? it.spec.states[n - 1] : "";
        const sinceKey = n ? f - it.keysF[n - 1] : 99;
        const posted = f >= it.postF;
        const caretOn = !posted && (sinceKey < 10 || Math.floor(f / 15) % 2 === 0);
        it.caret.classList.toggle("off", !caretOn);
        it.btn.classList.toggle("on", posted);
        const pop = posted ? Math.max(0, 1 - (f - it.postF) / 6) : 0;
        it.btn.style.transform = `scale(${r4(1 + 0.1 * Math.sin(Math.PI * pop))})`;
        tkey = `:t${n}:${caretOn ? 1 : 0}:${posted ? 1 : 0}:${r4(pop)}`;
      }
      if (it.spans && it.wordsF) {
        // 단어별 등장: 각 단어가 자기 시각부터 word_frames 동안 아래에서 떠오르며 나타난다
        const n = it.spec.word_frames || 8;
        it.spans.forEach((sp, wi) => {
          const lf = f - it.wordsF[Math.min(wi, it.wordsF.length - 1)];
          const p = lf < 0 ? 0 : clamp01((lf + 1) / n);
          const wop = r4(p), wdy = r4(16 * (1 - easeOut(p)));
          sp.style.opacity = String(wop);
          sp.style.transform = `translateY(${wdy}px)`;
          tkey += `:w${wi}=${wop},${wdy}`;
        });
      }
      if (typeof it.spec.y === "number" && typeof it.spec.y_to === "number" && typeof it.spec.move_at === "number") {
        // 세로 위치 이동: move_at부터 move_frames 동안 y에서 y_to로 (ease-out)
        const mf = toFrame(it.spec.move_at), mn = it.spec.move_frames || 12;
        const p = f < mf ? 0 : clamp01((f - mf + 1) / mn);
        const me = it.spec.move_ease === "inOut" ? easeInOut(p) : easeOut(p);
        const top = r4(it.spec.y + (it.spec.y_to - it.spec.y) * me);
        it.wrap.style.top = top + "px";
        tkey += `:y${top}`;
        if (typeof it.spec.scale_to === "number") { it.moveScale = r4(1 + (it.spec.scale_to - 1) * me); tkey += `:ms${it.moveScale}`; }
        if (typeof it.spec.ls_to === "number") {
          const ls0 = typeof it.spec.letter_spacing === "number" ? it.spec.letter_spacing : 0;
          const ls = r4(ls0 + (it.spec.ls_to - ls0) * me); it.el.style.letterSpacing = ls + "em"; tkey += `:lm${ls}`;
        }
      }
      if (it.update) tkey += it.update(f);
      if (it.units) {
        const R = it.spec.reveal || null, X = it.spec.exit || null;
        const rE = easeFn(R && R.ease, "expo"), xE = easeFn(X && X.ease, "cubic");
        it.units.forEach((u, i) => {
          let tr = "none", op = 1, bl = 0, fill = -1;
          if (R) {
            const p = f < u.tf ? 0 : clamp01((f - u.tf + 1) / (R.dur || 12));
            const e = rE(p);
            if (R.style === "rise") tr = `translateY(${r4((1 - e) * 110 * (R.distance || 1))}%)`;
            else if (R.style === "blur") { op = clamp01(p * 1.6); bl = (1 - e) * (R.blur || 14); tr = `scale(${r4(1.08 - 0.08 * e)})`; }
            else if (R.style === "flip") { op = clamp01(p * 2.2); tr = `perspective(700px) rotateX(${r4((1 - e) * 88)}deg)`; }
            else if (R.style === "scale") { op = clamp01(p * 1.5); bl = (1 - e) * (R.blur || 10); tr = `scale(${r4(1.5 - 0.5 * e)})`; }
            else if (R.style === "fade") op = e;
            else if (R.style === "fill") fill = e;
          }
          if (X && u.xf !== undefined && f >= u.xf) {
            const q = clamp01((f - u.xf + 1) / (X.dur || 8)), e = xE(q);
            if (X.style === "rise") tr = `translateY(${r4(-e * 110)}%)`;
            else if (X.style === "blur") { op = Math.min(op, 1 - e); bl = Math.max(bl, e * 12); }
            else op = Math.min(op, 1 - e);
          }
          u.el.style.transform = tr; if (R && R.style === "flip") u.el.style.transformOrigin = "50% 100%";
          u.el.style.opacity = String(r4(op));
          u.el.style.filter = bl > 0.05 ? `blur(${r4(bl)}px)` : "none";
          if (fill >= 0) u.chars.forEach(c => { c.el.style.color = fill >= 1 ? c.full : `color-mix(in srgb, ${c.full} ${Math.round(18 + 82 * fill)}%, transparent)`; });
          tkey += `|${tr}${r4(op)}${r4(bl)}${fill >= 0 ? r4(fill) : ""}`;
        });
      }
      if (it.clone) {
        const S = it.spec.sheen, sf0 = toFrame(S.at), sn = S.dur || 18, w = S.width || 14;
        const p = (f - sf0 + 1) / sn;
        if (p <= 0 || p >= 1) { it.clone.style.opacity = "0"; tkey += ":sh0"; }
        else {
          const x = -w + (100 + 2 * w) * easeInOut(p);
          const m = `linear-gradient(100deg, rgba(0,0,0,0) ${r4(x - w)}%, #000 ${r4(x)}%, rgba(0,0,0,0) ${r4(x + w)}%)`;
          it.clone.style.webkitMaskImage = m; it.clone.style.maskImage = m; it.clone.style.opacity = String(S.opacity || 0.9);
          it.clone.style.letterSpacing = it.el.style.letterSpacing;
          tkey += `:sh${r4(x)}`;
        }
      }
      if (it.bar) {
        const Ud = it.spec.underline;
        // 밑줄 대상: 강조 단어 묶음 전체(같은 줄에서 첫 강조부터 이어진 강조 단어들) 또는 단어 번호
        let run = [];
        if (Ud.word === "accent") {
          const ws = it.uwords || []; const k0 = ws.findIndex(w => w.accent);
          if (k0 >= 0) { run.push(ws[k0]); for (let k = k0 + 1; k < ws.length && ws[k].accent && ws[k].line === ws[k0].line; k++) run.push(ws[k]); }
        } else if ((it.uwords || [])[Ud.word || 0]) run = [it.uwords[Ud.word || 0]];
        if (run.length) {
          const L = Math.min(...run.map(w => w.el.offsetLeft)), R2 = Math.max(...run.map(w => w.el.offsetLeft + w.el.offsetWidth));
          const T = run[0].el.offsetTop, W = R2 - L, H = run[0].el.offsetHeight;
          const p = clamp01((f - toFrame(Ud.at) + 1) / (Ud.dur || 12)), e = EASES.expo(p);
          // 글자가 퇴장하면 밑줄도 함께 사라진다
          let bo = 1;
          if (it.units && it.spec.exit && it.spec.exit.style !== "zoom") {
            const xf0 = Math.min(...it.units.map(u => u.xf ?? 1e9));
            if (f >= xf0) bo = 1 - clamp01((f - xf0 + 1) / ((it.spec.exit.dur || 8) + Math.round((it.units.length - 1) * (it.spec.exit.stagger || 0) * fps)));
          }
          Object.assign(it.bar.style, { left: L + "px", top: (T + H * 0.98 + (Ud.offset || 0)) + "px", width: W + "px", transform: `scaleX(${r4(e)})`, opacity: String(r4(bo)) });
          tkey += `:bo${r4(bo)}`;
          tkey += `:ul${r4(e)}:${L},${T},${W}`;
        }
      }
      const a = animIn(it.spec.anim_in, f - it.sf, it.spec);
      if (a.ls !== undefined) { it.el.style.letterSpacing = r4(a.ls) + "em"; tkey += `:ls${r4(a.ls)}`; }
      if (a.wipe !== undefined) {
        const edge = -25 + 150 * a.wipe;            // -25% -> 125%
        const m = a.wipe >= 1 ? "none" : `linear-gradient(90deg, #000 ${r4(edge)}%, rgba(0,0,0,0) ${r4(edge + 22)}%)`;
        (it.root || it.el).style.webkitMaskImage = m; (it.root || it.el).style.maskImage = m;
        tkey += `:wp${r4(a.wipe)}`;
      }
      const opacity = r4(a.opacity * animOut(it.spec.anim_out, it.ef - f, it.spec, f) * (it.maxOpacity ?? 1));
      // drift_scale: 요소가 보이는 동안 선형으로 커지는 느린 줌 (예: 0.03이면 1.00에서 1.03)
      const dEnd = it.spec.drift_until !== undefined ? toFrame(it.spec.drift_until) : it.ef - 1;
      const drift = it.spec.drift_scale ? it.spec.drift_scale * clamp01((f - it.sf) / Math.max(1, dEnd - it.sf)) : 0;
      // 퇴장 zoom: 카메라가 글자를 뚫고 지나가듯 커지며 흐려진다
      let zs = 1, zb = 0, zo = 1;
      if (it.spec.exit && it.spec.exit.style === "zoom") {
        const zn = it.spec.exit.dur || 10, zf = it.ef - zn;
        // 앞부분은 글자가 보인 채로 커지고, 뒤로 갈수록 흐려지며 사라진다 (opacity 1-q³, scale 1+0.9q², blur 16q²)
        if (f >= zf) { const q = clamp01((f - zf + 1) / zn), q2 = q * q; zs = 1 + (it.spec.exit.amount || 0.9) * q2; zb = 16 * q2; zo = 1 - q2 * q; tkey += `:zx${r4(q)}`; }
      }
      const transform = `translateY(${r4(a.dy)}px) scale(${r4((a.scale + drift) * (it.moveScale ?? 1) * zs)})`;
      const blurAll = a.blur + zb;
      const filter = blurAll > 0.005 ? `blur(${r4(blurAll)}px)` : "none";
      const root = it.root || it.el;
      root.style.opacity = String(r4(opacity * zo));
      root.style.transform = transform;
      root.style.filter = filter;
      key.push(`${i}:${opacity}:${transform}:${filter}${tkey}`);
    });
    return key.join("|");
  };
})();
</script>
</body>
</html>
