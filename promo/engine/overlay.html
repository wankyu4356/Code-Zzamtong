<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1920px; height: 1080px; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Pretendard", "Noto Sans CJK KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pos { position: absolute; left: 0; right: 0; display: flex; box-sizing: border-box; }
  .anim { transform-origin: 50% 50%; }
  .text { white-space: pre-line; word-break: keep-all; overflow-wrap: break-word; }
  .card {
    box-sizing: border-box; padding: 44px 52px; border-radius: 28px; color: #fff;
    background: rgba(14, 14, 16, 0.74); border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  }
  .stars { display: flex; gap: 6px; }
  .stars svg { width: 36px; height: 36px; }
  .review {
    margin-top: 22px; font-size: 44px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em;
    word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .source { margin-top: 26px; font-size: 28px; font-weight: 500; opacity: 0.6; letter-spacing: 0; }
  .flash { position: absolute; inset: 0; }
  .rt { box-sizing: border-box; padding: 40px 52px 34px; border-radius: 26px; color: #fff;
        background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.13); }
  .rt .head { display: flex; align-items: center; gap: 18px; }
  .rt .avatar { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2b6fd6, #6ea8ff); flex: none; }
  .rt .nick { font-size: 33px; font-weight: 600; letter-spacing: -0.01em; }
  .rt .chip { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.62); margin-top: 2px; }
  .rt .date { margin-left: auto; font-size: 24px; color: rgba(255,255,255,0.5); }
  .rt .body { margin-top: 32px; min-height: 190px; font-size: 64px; font-weight: 500; line-height: 1.45; letter-spacing: -0.01em;
        word-break: keep-all; white-space: pre-wrap; }
  .rt .caret { display: inline-block; width: 4px; height: 0.95em; background: #fff; vertical-align: -0.12em; margin-left: 4px; border-radius: 2px; }
  .rt .caret.off { visibility: hidden; }
  .rt .foot { display: flex; justify-content: flex-end; margin-top: 22px; }
  .rt .btn { font-size: 27px; font-weight: 600; padding: 12px 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
        color: rgba(255,255,255,0.7); transform-origin: 50% 50%; }
  .rt .btn.on { background: #2f7fe0; border-color: #2f7fe0; color: #fff; }
  .chat { position: relative; }
  .msg { position: absolute; left: 0; display: flex; align-items: flex-end; gap: 18px; transform-origin: 0% 100%; }
  .msg .av { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
             font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2b6fd6, #6ea8ff); margin-bottom: 4px; }
  .msg .col { display: flex; flex-direction: column; gap: 10px; }
  .msg .meta { font-size: 26px; color: rgba(255,255,255,0.62); padding-left: 6px; }
  .msg .bubble { display: inline-block; background: #f4f4f6; color: #111114; border-radius: 30px; border-bottom-left-radius: 8px; padding: 26px 36px;
                 font-size: 58px; font-weight: 500; line-height: 1.4; letter-spacing: -0.012em; word-break: keep-all; white-space: pre-wrap;
                 box-shadow: 0 18px 50px rgba(0,0,0,0.35); max-width: 1180px; }
  .msg .dots { display: inline-flex; gap: 12px; align-items: center; background: #f4f4f6; border-radius: 30px; border-bottom-left-radius: 8px; padding: 30px 34px; }
  .msg .dots i { width: 16px; height: 16px; border-radius: 50%; background: #8a8a92; display: block; }
  .rcpt { position: relative; }
  .rcpt .printer { position: absolute; left: 50%; transform: translateX(-50%); top: 0; width: 1260px; height: 88px; border-radius: 20px;
                   background: linear-gradient(180deg, #2a2a2f, #151518); box-shadow: 0 18px 40px rgba(0,0,0,0.5); }
  .rcpt .printer::after { content: ""; position: absolute; left: 110px; right: 110px; bottom: 14px; height: 7px; border-radius: 3px; background: #050506; }
  .rcpt .win { position: absolute; left: 50%; transform: translateX(-50%); top: 74px; width: 1000px; overflow: hidden; }
  .rcpt .paper { position: relative; width: 1000px; background: #faf8f2; color: #17171a; padding: 44px 56px 34px;
                 font-family: "NanumGothicCoding", "Pretendard", monospace; font-size: 34px; line-height: 1.5; letter-spacing: 0;
                 box-shadow: 0 30px 60px rgba(0,0,0,0.45); transform-origin: 50% 0%;
                 clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), 97.5% 100%, 95% calc(100% - 14px), 92.5% 100%, 90% calc(100% - 14px), 87.5% 100%, 85% calc(100% - 14px), 82.5% 100%, 80% calc(100% - 14px), 77.5% 100%, 75% calc(100% - 14px), 72.5% 100%, 70% calc(100% - 14px), 67.5% 100%, 65% calc(100% - 14px), 62.5% 100%, 60% calc(100% - 14px), 57.5% 100%, 55% calc(100% - 14px), 52.5% 100%, 50% calc(100% - 14px), 47.5% 100%, 45% calc(100% - 14px), 42.5% 100%, 40% calc(100% - 14px), 37.5% 100%, 35% calc(100% - 14px), 32.5% 100%, 30% calc(100% - 14px), 27.5% 100%, 25% calc(100% - 14px), 22.5% 100%, 20% calc(100% - 14px), 17.5% 100%, 15% calc(100% - 14px), 12.5% 100%, 10% calc(100% - 14px), 7.5% 100%, 5% calc(100% - 14px), 2.5% 100%, 0 calc(100% - 14px)); }
  .rcpt .c { text-align: center; }
  .rcpt .t1 { font-size: 42px; font-weight: 700; }
  .rcpt .t2 { font-size: 31px; color: #4a4a50; margin-top: 2px; }
  .rcpt .hr { border-top: 3px dashed #b9b6ad; margin: 22px 0; }
  .rcpt .kv { display: flex; justify-content: space-between; font-size: 32px; color: #2a2a2f; }
  .rcpt .body { font-size: 58px; font-weight: 700; line-height: 1.4; word-break: keep-all; white-space: pre-wrap; margin: 8px 0 6px; }
  .rcpt .bar { height: 64px; margin: 8px auto 10px; width: 720px;
               background: repeating-linear-gradient(90deg, #1a1a1c 0 4px, transparent 4px 7px, #1a1a1c 7px 9px, transparent 9px 15px, #1a1a1c 15px 21px, transparent 21px 24px, #1a1a1c 24px 26px, transparent 26px 33px); }
  .rcpt .foot { font-size: 28px; color: #4a4a50; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const SAFE = 96;
  const TEXT_DEFAULTS = {
    size: 200, weight: 900, color: "#fff", x: "center", y: "center", letter_spacing: -0.04,
    line_height: 1.05, anim_in: "hit", anim_out: "cut", max_width: 1500, align: "center", shadow: true,
  };
  const CARD_DEFAULTS = { stars: 5, source: "", anim_in: "rise", anim_out: "cut", x: "center", y: "center", width: 1100 };
  const FLASH_DEFAULTS = { frames: 2, color: "#fff", opacity: 0.9 };
  const IMAGE_DEFAULTS = { width: 900, x: "center", y: "center", anim_in: "fade", anim_out: "cut", opacity: 1 };
  const pendingImages = [];
  const STAR = "M12 2.6l2.9 6.2 6.8.8-5 4.6 1.3 6.7-6-3.3-6 3.3 1.3-6.7-5-4.6 6.8-.8z";

  let fps = 30, items = [];
  const toFrame = (sec) => Math.floor(sec * fps + 0.5);
  const r4 = (v) => Math.round(v * 10000) / 10000;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const ramp = (lf, n) => clamp01(lf / n);          // geometry: start value shown on frame 0
  const fadeIn = (lf, n) => clamp01((lf + 1) / n);  // opacity: 1/n on frame 0, 1 on frame n-1

  // Placement wrapper: x via flex, y via top/bottom (+translateY for center).
  function place(spec, el) {
    const pos = document.createElement("div");
    pos.className = "pos";
    const x = spec.x, y = spec.y;
    if (typeof x === "number") { pos.style.justifyContent = "flex-start"; pos.style.paddingLeft = x + "px"; }
    else { pos.style.justifyContent = { left: "flex-start", right: "flex-end" }[x] || "center";
           pos.style.paddingLeft = pos.style.paddingRight = SAFE + "px"; }
    if (typeof y === "number") pos.style.top = y + "px";
    else if (y === "top") pos.style.top = SAFE + "px";
    else if (y === "bottom") pos.style.bottom = SAFE + "px";
    else { pos.style.top = "50%"; pos.style.transform = "translateY(-50%)"; }
    pos.appendChild(el);
    return pos;
  }

  function makeText(t) {
    const s = Object.assign({}, TEXT_DEFAULTS, t);
    const el = document.createElement("div");
    el.className = "anim text";
    // words: 단어별 등장 시각(초) 배열. *단어*는 강조색(accent_color). 둘 중 하나라도 있으면 단어를 span으로 나눈다.
    const wordsF = Array.isArray(s.words) && s.words.length ? s.words.map(t => toFrame(t)) : null;
    const spans = [];
    if (wordsF || /\*[^*]+\*/.test(s.text)) {
      s.text.split("\n").forEach((line, li) => {
        if (li > 0) el.appendChild(document.createElement("br"));
        line.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(part)); return; }
          const sp = document.createElement("span");
          sp.style.display = "inline-block";
          let txt = part;
          if (/^\*[^*]+\*[,.!?…]*$/.test(part)) { txt = part.replace(/\*/g, ""); sp.style.color = s.accent_color || "#003070"; }
          sp.textContent = txt;
          el.appendChild(sp);
          spans.push(sp);
        });
      });
    } else el.textContent = s.text;
    if (s.font) el.style.fontFamily = `"${s.font}", "Pretendard", "Noto Sans CJK KR", sans-serif`;
    Object.assign(el.style, {
      fontSize: s.size + "px", fontWeight: String(s.weight), color: s.color,
      letterSpacing: s.letter_spacing + "em", lineHeight: String(s.line_height),
      maxWidth: s.max_width + "px", textAlign: s.align,
      textShadow: s.shadow ? "0 2px 24px rgba(0,0,0,.55)" : "none",
    });
    // Chromium applies letter-spacing after the last glyph too, so a centered line's advance box
    // sits |ls|/2 off center. Pad the right side by |ls| to center the advance box exactly.
    if (s.align === "center" && s.letter_spacing < 0) el.style.paddingRight = (-s.letter_spacing) + "em";
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), spans: wordsF ? spans : null, wordsF };
  }

  function makeCard(c) {
    const s = Object.assign({}, CARD_DEFAULTS, c);
    const el = document.createElement("div");
    el.className = "anim card";
    el.style.width = s.width + "px";
    const stars = document.createElement("div");
    stars.className = "stars";
    for (let i = 0; i < 5; i++) {
      const fill = i < s.stars ? "#FFC53D" : "rgba(255,255,255,0.22)";
      stars.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 24 24"><path d="${STAR}" fill="${fill}"/></svg>`);
    }
    const review = document.createElement("div");
    review.className = "review";
    review.textContent = s.text;
    el.appendChild(stars);
    el.appendChild(review);
    if (s.source) {
      const src = document.createElement("div");
      src.className = "source";
      src.textContent = s.source;
      el.appendChild(src);
    }
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end) };
  }

  function makeImage(im) {
    const s = Object.assign({}, IMAGE_DEFAULTS, im);
    const el = document.createElement("img");
    el.className = "anim image";
    el.src = s.src.startsWith("data:") || s.src.startsWith("file://") ? s.src : "file://" + encodeURI(s.src);
    el.style.width = s.width + "px";
    el.style.height = "auto";
    el.style.display = "block";
    pendingImages.push(el.decode().catch(() => {}));
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), maxOpacity: s.opacity };
  }

  const TYPING_DEFAULTS = { width: 1380, x: "center", y: "center", anim_in: "rise", anim_out: "cut", in_frames: 6 };
  function makeTyping(sp) {
    const s = Object.assign({}, TYPING_DEFAULTS, sp);
    const el = document.createElement("div");
    el.className = "anim rt";
    el.style.width = s.width + "px";
    const initial = (s.nick || "").trim().charAt(0) || "N";
    el.innerHTML = `<div class="head"><div class="avatar">${initial}</div><div><div class="nick"></div><div class="chip"></div></div><div class="date"></div></div>
      <div class="body"><span class="txt"></span><span class="caret"></span></div>
      <div class="foot"><span class="btn">등록</span></div>`;
    el.querySelector(".nick").textContent = s.nick || "";
    el.querySelector(".chip").textContent = s.chip || "";
    el.querySelector(".date").textContent = s.date || "";
    const keysF = s.keys.map(t => toFrame(t));
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), typing: true, keysF, postF: toFrame(s.post_at),
             txt: el.querySelector(".txt"), caret: el.querySelector(".caret"), btn: el.querySelector(".btn") };
  }

  const CHAT_DEFAULTS = { width: 1400, x: "center", y: "center", anim_in: "none", anim_out: "cut", gap: 26, dots_frames: 10, shift_frames: 9 };
  function makeChat(sp) {
    const s = Object.assign({}, CHAT_DEFAULTS, sp);
    const el = document.createElement("div");
    el.className = "anim chat";
    el.style.width = s.width + "px";
    el.style.height = (s.height || 720) + "px";
    const msgs = s.messages.map((m) => {
      const row = document.createElement("div");
      row.className = "msg";
      const av = document.createElement("div"); av.className = "av"; av.textContent = (m.nick || "").trim().charAt(0) || "N";
      const col = document.createElement("div"); col.className = "col";
      const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = [m.nick, m.chip, m.date].filter(Boolean).join(" · ");
      const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = m.text;
      const dots = document.createElement("div"); dots.className = "dots"; dots.innerHTML = "<i></i><i></i><i></i>";
      col.appendChild(meta); col.appendChild(bubble); col.appendChild(dots);
      row.appendChild(av); row.appendChild(col); el.appendChild(row);
      return { m, row, bubble, dots, meta, tf: toFrame(m.typing_from), af: toFrame(m.arrive_at), hB: 0, hD: 0 };
    });
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), chat: true, msgs, measured: false };
  }
  function layoutChat(it, f) {
    // 높이 측정은 폰트가 준비된 첫 렌더에서 한 번
    if (!it.measured) {
      for (const x of it.msgs) {
        x.bubble.style.display = "inline-block"; x.dots.style.display = "none";
        x.hB = x.row.offsetHeight;
        x.bubble.style.display = "none"; x.dots.style.display = "inline-flex";
        x.hD = x.row.offsetHeight;
      }
      it.measured = true;
    }
    const H = parseFloat(it.el.style.height), gap = it.spec.gap;
    // 어떤 시점의 목표 배치: 아래에서 위로 쌓는다
    const layoutAt = (fr) => {
      const rows = it.msgs.filter(x => x.tf <= fr).map(x => ({ x, h: fr >= x.af ? x.hB : x.hD }));
      let y = H; const pos = new Map();
      for (let i = rows.length - 1; i >= 0; i--) { y -= rows[i].h; pos.set(rows[i].x, y); y -= gap; }
      return pos;
    };
    // 마지막 이벤트(입력 시작 또는 도착) 이후 shift_frames 동안 이전 배치에서 새 배치로 이동
    let lastEv = -1;
    for (const x of it.msgs) { if (x.tf <= f) lastEv = Math.max(lastEv, x.tf); if (x.af <= f) lastEv = Math.max(lastEv, x.af); }
    const cur = layoutAt(f), prev = layoutAt(lastEv - 1);
    const e = easeOut(clamp01((f - lastEv + 1) / it.spec.shift_frames));
    const key = [];
    for (const x of it.msgs) {
      const on = x.tf <= f;
      x.row.style.display = on ? "flex" : "none";
      if (!on) continue;
      const arrived = f >= x.af;
      x.bubble.style.display = arrived ? "inline-block" : "none";
      x.dots.style.display = arrived ? "none" : "inline-flex";
      x.meta.style.visibility = arrived ? "visible" : "hidden";
      const yT = cur.get(x), yP = prev.has(x) ? prev.get(x) : yT;
      const y = yP + (yT - yP) * e;
      // 도착 팝: 0.7 -> 1.06 -> 1.0 (8프레임), 입력 중 점은 순서대로 튀어오른다
      let sc = 1, op = 1;
      if (arrived) { const p = clamp01((f - x.af) / 8); sc = p < 0.6 ? 0.7 + 0.36 * easeOut(p / 0.6) : 1.06 - 0.06 * ((p - 0.6) / 0.4); op = clamp01((f - x.af + 1) / 3); }
      else { const p = clamp01((f - x.tf + 1) / 4); sc = 0.85 + 0.15 * p; op = p; }
      x.row.style.top = r4(y) + "px";
      x.row.style.transform = `scale(${r4(sc)})`;
      x.row.style.opacity = String(r4(op));
      let dk = "";
      if (!arrived) {
        const ph = Math.floor(f / 4) % 3;
        x.dots.querySelectorAll("i").forEach((d, i) => { const up = i === ph; d.style.transform = up ? "translateY(-8px)" : "none"; d.style.opacity = up ? "1" : "0.55"; });
        dk = ":" + ph;
      }
      key.push(`${r4(y)}:${r4(sc)}:${r4(op)}:${arrived ? 1 : 0}${dk}`);
    }
    return key.join("/");
  }

  const RECEIPT_DEFAULTS = { width: 1260, x: "center", y: 60, anim_in: "none", anim_out: "cut", height: 1010, step_frames: 3 };
  function makeReceipt(sp) {
    const s = Object.assign({}, RECEIPT_DEFAULTS, sp);
    const el = document.createElement("div");
    el.className = "anim rcpt";
    el.style.width = s.width + "px";
    el.style.height = s.height + "px";
    el.innerHTML = `<div class="win"><div class="paper">
        <div class="c t1">네이버 방문자 리뷰</div><div class="c t2">${s.chip || "영수증 인증"}</div>
        <div class="hr"></div>
        <div class="kv"><span>방문일</span><span>${s.date || ""}</span></div>
        <div class="kv"><span>작성자</span><span>${s.nick || ""}</span></div>
        <div class="hr"></div>
        <div class="body"></div>
        <div class="hr"></div>
        <div class="bar"></div>
        <div class="c foot">김철신정형외과의원 · 낙성대역 4번 출구 1분</div>
      </div></div><div class="printer"></div>`;
    el.querySelector(".body").textContent = s.text;
    const stepsF = s.line_times.map(t => toFrame(t));
    return { spec: s, el, sf: toFrame(s.start), ef: toFrame(s.end), receipt: true, stepsF, tearF: toFrame(s.tear_at),
             win: el.querySelector(".win"), paper: el.querySelector(".paper"), H: 0 };
  }
  function renderReceipt(it, f) {
    if (!it.H) { it.win.style.height = "auto"; it.H = it.paper.offsetHeight; }
    const n = it.stepsF.length;
    const pitch = it.H / n;
    let k = 0; while (k < n && it.stepsF[k] <= f) k++;
    // 한 줄씩 지직: 스텝 시작 후 step_frames 동안 빠르게 밀려 나오고 멈춘다. 종이 자체도 위아래로 1px 떨린다
    let emerged = 0;
    if (k > 0) {
      const since = f - it.stepsF[k - 1];
      const e = easeOut(clamp01((since + 1) / it.spec.step_frames));
      emerged = Math.min(it.H, pitch * (k - 1) + pitch * e);
    }
    const jitter = (k > 0 && k < n && (f - it.stepsF[k - 1]) < it.spec.step_frames) ? ((f % 2) ? 1 : -1) : 0;
    const torn = f >= it.tearF;
    let ty = 0, rot = 0, op = 1;
    if (torn) {
      const d = f - it.tearF;
      // 뜯김: 3프레임 동안 6px 내려앉고 2도 기울어진 뒤 낙하
      const p = clamp01(d / 3);
      rot = 2.2 * p;
      ty = 6 * p + (d > 3 ? 0.55 * (d - 3) * (d - 3) : 0);
      op = clamp01(1 - Math.max(0, d - 22) / 8);
    }
    it.win.style.height = (torn ? it.H + 400 : emerged) + "px";
    it.win.style.overflow = torn ? "visible" : "hidden";
    it.paper.style.transform = `translateY(${r4(ty + jitter)}px) rotate(${r4(rot)}deg)`;
    it.paper.style.opacity = String(r4(op));
    return `:r${k}:${r4(emerged)}:${jitter}:${torn ? 1 : 0}:${r4(ty)}:${r4(op)}`;
  }

  function makeFlash(f) {
    const s = Object.assign({}, FLASH_DEFAULTS, f);
    const el = document.createElement("div");
    el.className = "flash";
    el.style.background = s.color;
    el.style.opacity = String(s.opacity);
    const sf = toFrame(s.at);
    return { spec: s, el, sf, ef: sf + s.frames, flash: true };
  }

  // Frame-local animation state. lf = frames since start, rem = frames until end (>= 1).
  // spec.in_frames / spec.out_frames override the default frame counts; spec.hit_scale overrides the start scale of hit/slam.
  function animIn(kind, lf, spec) {
    const n = spec && spec.in_frames;
    const hs = spec && spec.hit_scale;
    switch (kind) {
      case "hit": { const e = easeOut(ramp(lf, n || 4)); const s0 = hs || 1.10; return { scale: s0 - (s0 - 1) * e, dy: 0, opacity: 1, blur: 1 - e }; }
      case "slam": { const e = easeOut(ramp(lf, n || 3)); const s0 = hs || 1.7; return { scale: s0 - (s0 - 1) * e, dy: 0, opacity: fadeIn(lf, 2), blur: 0 }; }
      case "fade": { const p = ramp(lf, n || 8); return { scale: 1, dy: 12 * (1 - p), opacity: fadeIn(lf, n || 8), blur: 0 }; }
      case "rise": { const e = easeOut(ramp(lf, n || 6)); return { scale: 1, dy: 40 * (1 - e), opacity: fadeIn(lf, n || 6), blur: 0 }; }
      default: return { scale: 1, dy: 0, opacity: 1, blur: 0 };
    }
  }
  function animOut(kind, rem, spec) {
    const n = (spec && spec.out_frames) || 5;
    return kind === "fade" ? clamp01(rem / n) : 1;
  }

  window.setTimeline = function (tl) {
    fps = tl.fps;
    items = [];
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    stage.style.width = tl.width + "px";
    stage.style.height = tl.height + "px";
    document.body.style.width = tl.width + "px";
    document.body.style.height = tl.height + "px";
    const texts = [], cards = [], images = [], typings = [], flashes = [];
    pendingImages.length = 0;
    for (const shot of tl.shots) {
      for (const im of shot.images || []) images.push(makeImage(im));
      for (const t of shot.texts || []) texts.push(makeText(t));
      for (const c of shot.cards || []) cards.push(makeCard(c));
      for (const ty of shot.typing || []) typings.push(makeTyping(ty));
      for (const ch of shot.chat || []) typings.push(makeChat(ch));
      for (const rc of shot.receipts || []) typings.push(makeReceipt(rc));
      for (const f of shot.flashes || []) flashes.push(makeFlash(f));
    }
    window.__imagesReady = Promise.all(pendingImages).then(() => true);
    for (const it of [...images, ...texts, ...cards, ...typings]) { it.wrap = place(it.spec, it.el); stage.appendChild(it.wrap); items.push(it); }
    for (const it of flashes) { it.wrap = it.el; stage.appendChild(it.el); items.push(it); }
    for (const it of items) it.wrap.style.display = "none";
    return items.length;
  };

  // Pure function of the frame index. Returns a key describing the visible state.
  window.render = function (f) {
    const key = [];
    items.forEach((it, i) => {
      const visible = f >= it.sf && f < it.ef;
      it.wrap.style.display = visible ? (it.flash ? "block" : "flex") : "none";
      if (!visible) return;
      if (it.flash) { key.push(i + ":flash"); return; }
      let tkey = "";
      if (it.chat) tkey = ":c" + layoutChat(it, f);
      if (it.receipt) tkey = renderReceipt(it, f);
      if (it.typing) {
        // 누른 키 개수 -> 표시 문자열. 마지막 키 뒤 10프레임까지는 커서 고정, 그 뒤 15프레임 주기로 깜빡임
        let n = 0; while (n < it.keysF.length && it.keysF[n] <= f) n++;
        it.txt.textContent = n ? it.spec.states[n - 1] : "";
        const sinceKey = n ? f - it.keysF[n - 1] : 99;
        const posted = f >= it.postF;
        const caretOn = !posted && (sinceKey < 10 || Math.floor(f / 15) % 2 === 0);
        it.caret.classList.toggle("off", !caretOn);
        it.btn.classList.toggle("on", posted);
        const pop = posted ? Math.max(0, 1 - (f - it.postF) / 6) : 0;
        it.btn.style.transform = `scale(${r4(1 + 0.1 * Math.sin(Math.PI * pop))})`;
        tkey = `:t${n}:${caretOn ? 1 : 0}:${posted ? 1 : 0}:${r4(pop)}`;
      }
      if (it.spans && it.wordsF) {
        // 단어별 등장: 각 단어가 자기 시각부터 word_frames 동안 아래에서 떠오르며 나타난다
        const n = it.spec.word_frames || 8;
        it.spans.forEach((sp, wi) => {
          const lf = f - it.wordsF[Math.min(wi, it.wordsF.length - 1)];
          const p = lf < 0 ? 0 : clamp01((lf + 1) / n);
          const wop = r4(p), wdy = r4(16 * (1 - easeOut(p)));
          sp.style.opacity = String(wop);
          sp.style.transform = `translateY(${wdy}px)`;
          tkey += `:w${wi}=${wop},${wdy}`;
        });
      }
      const a = animIn(it.spec.anim_in, f - it.sf, it.spec);
      const opacity = r4(a.opacity * animOut(it.spec.anim_out, it.ef - f, it.spec) * (it.maxOpacity ?? 1));
      // drift_scale: 요소가 보이는 동안 선형으로 커지는 느린 줌 (예: 0.03이면 1.00에서 1.03)
      const drift = it.spec.drift_scale ? it.spec.drift_scale * ((f - it.sf) / Math.max(1, it.ef - it.sf - 1)) : 0;
      const transform = `translateY(${r4(a.dy)}px) scale(${r4(a.scale + drift)})`;
      const filter = a.blur > 0.005 ? `blur(${r4(a.blur)}px)` : "none";
      it.el.style.opacity = String(opacity);
      it.el.style.transform = transform;
      it.el.style.filter = filter;
      key.push(`${i}:${opacity}:${transform}:${filter}${tkey}`);
    });
    return key.join("|");
  };
})();
</script>
</body>
</html>
